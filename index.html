<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಶಹಾಪುರ ಮಾರ್ಕೆಟ್ - ಗ್ರಾಹಕರ ಆಪ್</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans pb-20">

    <!-- ಫೋಟೋ ಜೂಮ್ ಪಾಪ್‌ಅಪ್ -->
    <div id="image-modal" class="fixed inset-0 bg-black bg-opacity-80 z-50 hidden flex items-center justify-center p-4">
        <div class="relative bg-white p-2 rounded-2xl max-w-sm w-full text-center">
            <button onclick="closeImageModal()" class="absolute top-2 right-2 bg-red-500 text-white w-8 h-8 rounded-full font-bold">✕</button>
            <img id="zoomed-img" src="" class="w-full h-96 object-contain rounded-xl">
        </div>
    </div>

    <!-- ಸಕ್ಸಸ್ / ಪಾಪ್‌ಅಪ್ ಅಷ್ಟೇ -->
    <div id="custom-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-2xl shadow-2xl max-w-sm w-full text-center space-y-3">
            <div id="modal-icon" class="text-4xl">🎉</div>
            <h3 id="modal-title" class="text-lg font-bold text-gray-800">ಯಶಸ್ವಿ!</h3>
            <p id="modal-message" class="text-xs text-gray-600"></p>
            <button onclick="closeModal()" class="w-full bg-indigo-600 text-white py-2 rounded-xl font-bold text-xs">ಸರಿ (OK)</button>
        </div>
    </div>

    <!-- ಹೆಡರ್ -->
    <header class="bg-indigo-700 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-40">
        <div>
            <h1 class="text-sm font-bold">🛍️ ಶಹಾಪುರ ಮಾರ್ಕೆಟ್</h1>
            <p class="text-[10px] text-indigo-200">ಸ್ಥಳೀಯ ಅಂಗಡಿಗಳ ಆನ್‌ಲೈನ್ ಶಾಪಿಂಗ್</p>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="openCart()" class="relative bg-indigo-600 border border-indigo-400 px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1">
                🛒 ಕಾರ್ಟ್ <span id="cart-count" class="bg-red-500 text-white text-[10px] px-1.5 py-0.2 rounded-full">0</span>
            </button>
        </div>
    </header>

    <main class="container mx-auto p-4 max-w-md space-y-4">

        <!-- ಸರ್ಚ್ ಮತ್ತು ಕ್ಯಾಟಗರಿ ಫಿಲ್ಟರ್ -->
        <div class="space-y-2">
            <input type="text" id="search-box" placeholder="🔍 ವಸ್ತು ಅಥವಾ ಅಂಗಡಿಯ ಹೆಸರು ಹುಡುಕಿ..." oninput="filterProducts()" class="w-full p-2.5 border rounded-xl text-xs shadow-sm">
            <div class="flex gap-1 overflow-x-auto pb-1 text-xs">
                <button onclick="filterCategory('All')" class="cat-btn bg-indigo-600 text-white px-3 py-1.5 rounded-full font-bold whitespace-nowrap">ಎಲ್ಲಾ (All)</button>
                <button onclick="filterCategory('Clothing')" class="cat-btn bg-white text-gray-700 border px-3 py-1.5 rounded-full whitespace-nowrap">ಬಟ್ಟೆಗಳು</button>
                <button onclick="filterCategory('Footwear')" class="cat-btn bg-white text-gray-700 border px-3 py-1.5 rounded-full whitespace-nowrap">ಚಪ್ಪಲಿ & ಶೂಸ್</button>
                <button onclick="filterCategory('Gifts')" class="cat-btn bg-white text-gray-700 border px-3 py-1.5 rounded-full whitespace-nowrap">ಗಿಫ್ಟ್ ಐಟಮ್ಸ್</button>
                <button onclick="filterCategory('General')" class="cat-btn bg-white text-gray-700 border px-3 py-1.5 rounded-full whitespace-nowrap">ಜನರಲ್ / ಇತರೆ</button>
            </div>
        </div>

        <!-- ವಸ್ತುಗಳ ಲಿಸ್ಟ್ (Products Grid) -->
        <div id="products-list" class="grid grid-cols-2 gap-3">
            <p class="col-span-2 text-center text-xs text-gray-500 py-6">ಯಾವುದೇ ವಸ್ತುಗಳು ಲಭ್ಯವಿಲ್ಲ.</p>
        </div>

    </main>

    <!-- ಕಾರ್ಟ್ ಹಾಗೂ ಆರ್ಡರ್ ಮಾಡುವ ಬಾಟಮ್ ಶೀಟ್ -->
    <div id="cart-drawer" class="fixed inset-0 bg-black bg-opacity-60 z-50 hidden flex justify-end flex-col">
        <div class="bg-white rounded-t-3xl p-5 max-h-[85vh] overflow-y-auto space-y-4">
            <div class="flex justify-between items-center border-b pb-2">
                <h2 class="font-bold text-sm text-gray-800">🛒 ನಿಮ್ಮ ಕಾರ್ಟ್ (Cart)</h2>
                <button onclick="closeCart()" class="text-red-500 font-bold text-base">✕ ಮುಚ್ಚಿ</button>
            </div>

            <div id="cart-items-list" class="space-y-2 text-xs text-gray-700">
                ಕಾರ್ಟ್ ಖಾಲಿಯಾಗಿದೆ.
            </div>

            <div class="border-t pt-3 space-y-2">
                <div class="flex justify-between font-bold text-sm">
                    <span>ಒಟ್ಟು ಮೊತ್ತ:</span>
                    <span id="cart-total" class="text-indigo-600">₹0</span>
                </div>

                <div class="space-y-2 pt-2 border-t">
                    <h3 class="font-bold text-xs text-gray-800">ವಿಳಾಸ ಮತ್ತು ಸಂಪರ್ಕ ವಿವರಗಳು:</h3>
                    <input type="text" id="cust-name" placeholder="ನಿಮ್ಮ ಹೆಸರು" class="w-full p-2 border rounded-lg text-xs">
                    <input type="tel" id="cust-phone" placeholder="10 ಅಂಕಿಯ ಮೊಬೈಲ್ ನಂಬರ್" maxlength="10" class="w-full p-2 border rounded-lg text-xs">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="cust-pincode" placeholder="ಪಿನ್ ಕೋಡ್" maxlength="6" class="p-2 border rounded-lg text-xs" value="585223">
                        <input type="text" id="cust-city" placeholder="ಊರು / ಗ್ರಾಮ" class="p-2 border rounded-lg text-xs" value="ಶಹಾಪುರ">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="cust-taluk" placeholder="ತಾಲೂಕು" class="p-2 border rounded-lg text-xs" value="ಶಹಾಪುರ">
                        <input type="text" id="cust-district" placeholder="ಜಿಲ್ಲೆ" class="p-2 border rounded-lg text-xs" value="ಯಾದಗಿರಿ">
                    </div>

                    <div>
                        <label class="block text-[11px] text-gray-600 mb-1 font-semibold">ಪಾವತಿ ವಿಧಾನ (Payment Method):</label>
                        <select id="payment-method" class="w-full p-2 border rounded-lg text-xs font-bold bg-gray-50">
                            <option value="Cash on Delivery">ಕ್ಯಾಶ್ ಆನ್ ಡೆಲಿವರಿ (Cash on Delivery)</option>
                            <option value="Online UPI">ಆನ್‌ಲೈನ್ ಪಾವತಿ (UPI / QR Code)</option>
                        </select>
                    </div>

                    <button onclick="placeOrder()" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold text-xs shadow-lg">🚀 ಆರ್ಡರ್ ಖಚಿತಪಡಿಸಿ (Place Order)</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let products = JSON.parse(localStorage.getItem('market_products')) || [];
        let cart = [];
        let currentCategory = 'All';

        function showModal(title, message, icon = '🎉') {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal-icon').innerText = icon;
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

        function zoomImage(src) {
            document.getElementById('zoomed-img').src = src;
            document.getElementById('image-modal').classList.remove('hidden');
        }

        function closeImageModal() {
            document.getElementById('image-modal').classList.add('hidden');
        }

        function renderProducts(itemsToRender = products) {
            let grid = document.getElementById('products-list');
            if (itemsToRender.length === 0) {
                grid.innerHTML = `<p class="col-span-2 text-center text-xs text-gray-500 py-6">ಯಾವುದೇ ವಸ್ತುಗಳು ಲಭ್ಯವಿಲ್ಲ.</p>`;
                return;
            }

            grid.innerHTML = itemsToRender.map(p => `
                <div class="bg-white p-2.5 rounded-2xl shadow-sm border space-y-2 flex flex-col justify-between">
                    <div>
                        <div class="grid grid-cols-2 gap-1 relative">
                            <img src="${p.frontPhoto}" onclick="zoomImage('${p.frontPhoto}')" class="w-full h-28 object-cover rounded-xl cursor-pointer border">
                            <img src="${p.backPhoto}" onclick="zoomImage('${p.backPhoto}')" class="w-full h-28 object-cover rounded-xl cursor-pointer border">
                            <span class="absolute top-1 left-1 bg-black bg-opacity-60 text-white text-[9px] px-1.5 py-0.5 rounded">ಮುಂಭಾಗ</span>
                            <span class="absolute top-1 right-1 bg-black bg-opacity-60 text-white text-[9px] px-1.5 py-0.5 rounded">ಹಿಂಭಾಗ</span>
                        </div>
                        <h3 class="font-bold text-xs text-gray-800 mt-2 truncate">${p.name}</h3>
                        <p class="text-[10px] text-gray-500 truncate">ಅಂಗಡಿ: <b class="text-indigo-600">${p.vendorShop}</b></p>
                        <p class="text-[10px] text-gray-500">ಸೈಜ್: <span class="font-bold text-red-600">${p.size}</span></p>
                        <p class="text-[10px] font-semibold text-purple-700">${p.pieces || '1 ಪೀಸ್'} | ${p.returnPolicy || 'ರಿಟರ್ನ್ ಉಂಟು'}</p>
                    </div>

                    <div class="space-y-1.5 pt-1 border-t">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-green-600">₹${p.discPrice}</span>
                            <span class="text-[10px] text-gray-400 line-through">₹${p.origPrice}</span>
                        </div>
                        <button onclick="addToCart(${p.id})" class="w-full bg-indigo-600 text-white py-1.5 rounded-xl text-[11px] font-bold shadow">🛒 ಕಾರ್ಟ್‌ಗೆ ಹಾಕಿ</button>
                    </div>
                </div>
            `).join('');
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn bg-white text-gray-700 border px-3 py-1.5 rounded-full whitespace-nowrap text-xs";
            });
            event.target.className = "cat-btn bg-indigo-600 text-white px-3 py-1.5 rounded-full whitespace-nowrap text-xs font-bold";

            if (cat === 'All') {
                renderProducts(products);
            } else {
                let filtered = products.filter(p => p.category === cat);
                renderProducts(filtered);
            }
        }

        function filterProducts() {
            let query = document.getElementById('search-box').value.toLowerCase();
            let filtered = products.filter(p => p.name.toLowerCase().includes(query) || p.vendorShop.toLowerCase().includes(query));
            renderProducts(filtered);
        }

        function addToCart(id) {
            let prod = products.find(p => p.id === id);
            if (!prod) return;

            let existing = cart.find(item => item.id === id);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ ...prod, quantity: 1 });
            }

            updateCartCount();
            showModal("ಸ ಸೇರಿಸಲಾಗಿದೆ!", "ವಸ್ತು ಕಾರ್ಟ್‌ಗೆ ಸೇರಿಸಲಾಗಿದೆ.", "🛒");
        }

        function updateCartCount() {
            let totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cart-count').innerText = totalCount;
        }

        function openCart() {
            let list = document.getElementById('cart-items-list');
            if (cart.length === 0) {
                list.innerHTML = "ಕಾರ್ಟ್ ಖಾಲಿಯಾಗಿದೆ.";
                document.getElementById('cart-total').innerText = "₹0";
            } else {
                let total = 0;
                list.innerHTML = cart.map(item => {
                    total += item.discPrice * item.quantity;
                    return `
                        <div class="flex justify-between items-center border-b pb-2">
                            <div class="flex items-center gap-2">
                                <img src="${item.frontPhoto}" class="w-10 h-10 object-cover rounded border">
                                <div>
                                    <p class="font-bold text-xs">${item.name} (${item.size})</p>
                                    <p class="text-[10px] text-gray-500">₹${item.discPrice} x ${item.quantity}</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-xs text-green-600">₹${item.discPrice * item.quantity}</span>
                                <button onclick="removeFromCart(${item.id})" class="text-red-500 font-bold px-1.5">✕</button>
                            </div>
                        </div>
                    `;
                }).join('');
                document.getElementById('cart-total').innerText = `₹${total}`;
            }
            document.getElementById('cart-drawer').classList.remove('hidden');
        }

        function closeCart() {
            document.getElementById('cart-drawer').classList.add('hidden');
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCartCount();
            openCart();
        }

        function placeOrder() {
            let name = document.getElementById('cust-name').value;
            let phone = document.getElementById('cust-phone').value;
            let pincode = document.getElementById('cust-pincode').value;
            let city = document.getElementById('cust-city').value;
            let taluk = document.getElementById('cust-taluk').value;
            let district = document.getElementById('cust-district').value;
            let paymentMethod = document.getElementById('payment-method').value;

            if (!name || !phone || phone.length < 10) {
                alert('ದಯವಿಟ್ಟು ನಿಮ್ಮ ಹೆಸರು ಮತ್ತು ಸರಿಯಾದ 10 ಅಂಕಿಯ ಮೊಬೈಲ್ ನಂಬರ್ ನಮೂದಿಸಿ!');
                return;
            }

            if (cart.length === 0) {
                alert('ನಿಮ್ಮ ಕಾರ್ಟ್ ಖಾಲಿಯಾಗಿದೆ!');
                return;
            }

            let orderId = Date.now();
            let totalAmount = cart.reduce((sum, item) => sum + (item.discPrice * item.quantity), 0);
            
            let newOrder = {
                id: orderId,
                items: cart,
                total: totalAmount,
                customerName: name,
                phone: phone,
                pincode: pincode,
                city: city,
                taluk: taluk,
                district: district,
                address: `${city}, ${taluk} ತಾಲೂಕು, ${district} ಜಿಲ್ಲೆ - ${pincode}`,
                paymentMethod: paymentMethod,
                paymentSuccess: paymentMethod === 'Cash on Delivery' ? false : true,
                status: 'ಹೊಸ ಆರ್ಡರ್ - ಪ್ಯಾಕಿಂಗ್ ಕಾಯಲಾಗುತ್ತಿದೆ',
                acceptedByVendor: null,
                packingReady: false,
                delivered: false
            };

            let allOrders = JSON.parse(localStorage.getItem('market_orders')) || [];
            allOrders.push(newOrder);
            localStorage.setItem('market_orders', JSON.stringify(allOrders));

            cart = [];
            updateCartCount();
            closeCart();

            showModal("ಯಶಸ್ವಿ!", `ನಿಮ್ಮ ಆರ್ಡರ್ ಯಶಸ್ವಿಯಾಗಿ ಸಲ್ಲಿಕೆಯಾಗಿದೆ! ಆರ್ಡರ್ ID: ${orderId}`, "🚀");
        }

        renderProducts();
    </script>
</body>
</html>
