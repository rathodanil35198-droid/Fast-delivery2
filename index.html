<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಶಹಾಪುರ ಮಾರ್ಕೆಟ್ - ಗ್ರಾಹಕರ ಆಪ್</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- ಫೋಟೋ ಜೂಮ್ ಪಾಪ್‌ಅಪ್ -->
    <div id="image-modal" class="fixed inset-0 bg-black bg-opacity-80 z-50 hidden flex items-center justify-center p-4">
        <div class="relative bg-white p-2 rounded-2xl max-w-sm w-full text-center">
            <button onclick="closeImageModal()" class="absolute top-2 right-2 bg-red-500 text-white w-8 h-8 rounded-full font-bold">✕</button>
            <img id="zoomed-img" src="" class="w-full h-96 object-contain rounded-xl">
        </div>
    </div>

    <!-- ಸಕ್ಸಸ್ / ಆರ್ಡರ್ ವಿವರಗಳ ಪಾಪ್‌ಅಪ್ -->
    <div id="custom-modal" class="fixed inset-0 bg-black bg-opacity-60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-2xl shadow-2xl max-w-sm w-full text-center space-y-3">
            <div id="modal-icon" class="text-4xl">🎉</div>
            <h3 id="modal-title" class="text-lg font-bold text-gray-800">ಯಶಸ್ವಿ!</h3>
            <p id="modal-message" class="text-xs text-gray-600"></p>
            <div id="modal-buttons" class="flex flex-col gap-2 pt-2">
                <button onclick="closeModal()" class="w-full bg-indigo-600 text-white py-2 rounded-xl font-bold text-xs">ಸರಿ (OK)</button>
            </div>
        </div>
    </div>

    <!-- ಹೆಡರ್ -->
    <header class="bg-indigo-700 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-40">
        <h1 class="text-sm font-bold">🛒 ಶಹಾಪುರ ಮಾರ್ಕೆಟ್ (ಗ್ರಾಹಕರು)</h1>
        <div id="user-info" class="text-xs hidden items-center gap-2">
            <span id="logged-user-name" class="font-semibold"></span>
            <button onclick="logout()" class="bg-red-500 px-2 py-1 rounded">ಲಾಗ್‌ಔಟ್</button>
        </div>
    </header>

    <main class="container mx-auto p-4 max-w-md">

        <!-- ೧. ಗ್ರಾಹಕರ ನೋಂದಣಿ / ಲಾಗಿನ್ ಪೇಜ್ (ಖರೀದಿಸುವಾಗ ಮಾತ್ರ ಬರುತ್ತದೆ) -->
        <div id="auth-screen" class="bg-white p-6 rounded-2xl shadow-lg space-y-4 hidden page-section">
            <div class="flex justify-between items-center border-b pb-2">
                <h2 class="text-xl font-bold text-gray-800">ಗ್ರಾಹಕರ ವಿವರ & ವಿಳಾಸ</h2>
                <button onclick="goBackToBrowse()" class="text-xs text-indigo-600 font-bold underline">← ವಾಪಸ್ ಹೋಗಿ</button>
            </div>
            
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block font-medium text-gray-700">ನಿಮ್ಮ ಹೆಸರು</label>
                    <input type="text" id="reg-name" placeholder="ನಿಮ್ಮ ಹೆಸರು ನಮೂದಿಸಿ" class="w-full p-2 border rounded-lg text-sm mt-1">
                </div>
                <div>
                    <label class="block font-medium text-gray-700">ಮೊಬೈಲ್ ನಂಬರ್</label>
                    <input type="tel" id="reg-phone" placeholder="10 ಅಂಕಿಯ ಮೊಬೈಲ್ ನಂಬರ್" maxlength="10" class="w-full p-2 border rounded-lg text-sm mt-1">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="reg-district" placeholder="ಜಿಲ್ಲೆ" class="p-2 border rounded-lg text-sm" value="ಯಾದಗಿರಿ">
                    <input type="text" id="reg-taluk" placeholder="ತಾಲೂಕು" class="p-2 border rounded-lg text-sm" value="ಶಹಾಪುರ">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="reg-city" placeholder="ಊರು / ಗ್ರಾಮ" class="p-2 border rounded-lg text-sm" value="ಶಹಾಪುರ">
                    <input type="text" id="reg-pincode" placeholder="ಪಿನ್ ಕೋಡ್" maxlength="6" class="p-2 border rounded-lg text-sm" value="585223">
                </div>
                <div>
                    <label class="block font-medium text-gray-700">ಪೂರ್ಣ ವಿಳಾಸ (Address)</label>
                    <textarea id="reg-address" placeholder="ಮನೆ ನಂಬರ್, ಬೀದಿ, ಊರು ಇತ್ಯಾದಿ" class="w-full p-2 border rounded-lg text-sm mt-1 h-16">1/29 Bheemrav Gudi Maruti Nagar, Near SBI Branch</textarea>
                </div>

                <button onclick="registerAndContinueOrder()" class="w-full bg-indigo-600 text-white py-2.5 rounded-xl font-bold text-sm shadow">ವಿಳಾಸ ಸೇವ್ ಮಾಡಿ ಮುಂದುವರಿಸಿ</button>
            </div>
        </div>

        <!-- ೨. ಗ್ರಾಹಕರ ಮುಖ್ಯ ಮುಖಪುಟ (ಎಲ್ಲರಿಗೂ ಮೊದಲು ಕಾಣುವುದು) -->
        <div id="dashboard-customer" class="space-y-4 page-section">
            
            <!-- ಟ್ಯಾಬ್ ಬಟನ್‌ಗಳು -->
            <div class="flex gap-2 mb-2">
                <button onclick="switchCustomerTab('browse')" id="tab-browse" class="flex-1 bg-indigo-600 text-white py-2 rounded-xl text-xs font-bold">🛍️ ವಸ್ತುಗಳು</button>
                <button onclick="switchCustomerTab('orders')" id="tab-orders" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded-xl text-xs font-bold">📦 ನನ್ನ ಆರ್ಡರ್‌ಗಳು</button>
            </div>

            <!-- ವಸ್ತುವನ್ನು ಬ್ರೌಸ್ ಮಾಡುವ ಸೆಕ್ಷನ್ -->
            <div id="cust-browse-section" class="space-y-3">
                <div class="bg-white p-4 rounded-xl shadow space-y-3">
                    <h3 class="font-bold text-base text-gray-800">🛍️ ಲಭ್ಯವಿರುವ ವಸ್ತುಗಳು</h3>
                    <input type="text" id="search-box" oninput="searchProducts()" placeholder="ವಸ್ತು ಅಥವಾ ಅಂಗಡಿ ಹೆಸರು ಹುಡುಕಿ..." class="w-full p-2 border rounded-lg text-sm">
                    <div id="customer-product-list" class="space-y-4 max-h-[500px] overflow-y-auto"></div>
                </div>
            </div>

            <!-- ನನ್ನ ಆರ್ಡರ್‌ಗಳು & ಟ್ರ್ಯಾಕಿಂಗ್ ಸೆಕ್ಷನ್ -->
            <div id="cust-orders-section" class="space-y-3 hidden">
                <div class="bg-white p-4 rounded-xl shadow space-y-2">
                    <h3 class="font-bold text-sm text-gray-800 border-b pb-1">📦 ನನ್ನ ಆರ್ಡರ್‌ಗಳು</h3>
                    <div id="customer-orders-list" class="text-xs text-gray-600">ಯಾವುದೇ ಆರ್ಡರ್‌ಗಳಿಲ್ಲ.</div>
                </div>
            </div>

        </div>

    </main>

    <script>
        let currentCustomer = JSON.parse(localStorage.getItem('currentCustomer')) || null;
        let products = JSON.parse(localStorage.getItem('market_products')) || [];
        let pendingProductId = null; // ಯಾವ ವಸ್ತುವನ್ನು ಖರೀದಿಸಲು ಕ್ಲಿಕ್ ಮಾಡಲಾಗಿತ್ತು ಎಂಬುದನ್ನು ನೆನಪಿಡಲು

        function showModal(title, message, icon = '🎉', buttonsHtml = '<button onclick="closeModal()" class="w-full bg-indigo-600 text-white py-2 rounded-xl font-bold text-xs">ಸರಿ (OK)</button>') {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerHTML = message;
            document.getElementById('modal-icon').innerText = icon;
            document.getElementById('modal-buttons').innerHTML = buttonsHtml;
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
            initApp();
        }

        function zoomImage(src) {
            document.getElementById('zoomed-img').src = src;
            document.getElementById('image-modal').classList.remove('hidden');
        }

        function closeImageModal() {
            document.getElementById('image-modal').classList.add('hidden');
        }

        function switchCustomerTab(tab) {
            if (tab === 'browse') {
                document.getElementById('cust-browse-section').classList.remove('hidden');
                document.getElementById('cust-orders-section').classList.add('hidden');
                document.getElementById('tab-browse').className = "flex-1 bg-indigo-600 text-white py-2 rounded-xl text-xs font-bold";
                document.getElementById('tab-orders').className = "flex-1 bg-gray-200 text-gray-700 py-2 rounded-xl text-xs font-bold";
            } else {
                // ಆರ್ಡರ್ ಟ್ಯಾಬ್ ನೋಡುವಾಗ ಲಾಗಿನ್ ಆಗಿಲ್ಲದಿದ್ದರೆ ಮೊದಲು ಅಡ್ರೆಸ್/ಲಾಗಿನ್ ಕೇಳುವುದು
                if (!currentCustomer) {
                    pendingProductId = null;
                    document.getElementById('auth-screen').classList.remove('hidden');
                    document.getElementById('dashboard-customer').classList.add('hidden');
                    return;
                }
                document.getElementById('cust-browse-section').classList.add('hidden');
                document.getElementById('cust-orders-section').classList.remove('hidden');
                document.getElementById('tab-orders').className = "flex-1 bg-indigo-600 text-white py-2 rounded-xl text-xs font-bold";
                document.getElementById('tab-browse').className = "flex-1 bg-gray-200 text-gray-700 py-2 rounded-xl text-xs font-bold";
                renderCustomerOrders();
            }
        }

        function initApp() {
            // ಮೊದಲಿಗೆ ಎಲ್ಲರಿಗೂ ಮುಖಪುಟ (ವಸ್ತುಗಳು) ನೇರವಾಗಿ ಕಾಣಿಸುತ್ತದೆ
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('dashboard-customer').classList.remove('hidden');
            
            if (currentCustomer) {
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('logged-user-name').innerText = `${currentCustomer.name} (ಗ್ರಾಹಕರು)`;
            } else {
                document.getElementById('user-info').classList.add('hidden');
            }
            renderCustomerProducts(products);
        }

        function goBackToBrowse() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('dashboard-customer').classList.remove('hidden');
        }

        function registerAndContinueOrder() {
            let name = document.getElementById('reg-name').value;
            let phone = document.getElementById('reg-phone').value;
            let district = document.getElementById('reg-district').value;
            let taluk = document.getElementById('reg-taluk').value;
            let city = document.getElementById('reg-city').value;
            let pincode = document.getElementById('reg-pincode').value;
            let address = document.getElementById('reg-address').value;

            if (!name || !phone || phone.length < 10) {
                alert('ದಯವಿಟ್ಟು ಸರಿಯಾದ ಹೆಸರು ಮತ್ತು ಮೊಬೈಲ್ ನಂಬರ್ ಹಾಕಿ!');
                return;
            }

            currentCustomer = { name, phone, district, taluk, city, pincode, address };
            localStorage.setItem('currentCustomer', JSON.stringify(currentCustomer));
            
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('dashboard-customer').classList.remove('hidden');
            document.getElementById('user-info').classList.remove('hidden');
            document.getElementById('logged-user-name').innerText = `${currentCustomer.name} (ಗ್ರಾಹಕರು)`;

            // ಒಂದು ವೇಳೆ ವಸ್ತುವನ್ನು ಖರೀದಿಸಲು ಕ್ಲಿಕ್ ಮಾಡಿ ಅಡ್ರೆಸ್ ಕೇಳಿದ್ದರೆ, ಈಗ ನೇರವಾಗಿ ಖರೀದಿ ಪಾಪ್‌ಅಪ್ ಓಪನ್ ಆಗುತ್ತದೆ
            if (pendingProductId) {
                let pid = pendingProductId;
                pendingProductId = null;
                openBuyModal(pid);
            } else {
                renderCustomerProducts(products);
            }
        }

        function logout() {
            localStorage.removeItem('currentCustomer');
            currentCustomer = null;
            initApp();
        }

        function renderCustomerProducts(list) {
            let listDiv = document.getElementById('customer-product-list');
            if (list.length === 0) {
                listDiv.innerHTML = "<p class='text-gray-500 text-xs'>ಯಾವುದೇ ವಸ್ತುಗಳು ಲಭ್ಯವಿಲ್ಲ.</p>";
                return;
            }
            listDiv.innerHTML = list.map(p => `
                <div class="border p-3 rounded-2xl bg-white shadow-sm space-y-2">
                    <div class="flex gap-2 justify-center">
                        <img src="${p.frontPhoto}" onclick="zoomImage('${p.frontPhoto}')" class="w-32 h-36 object-cover rounded-xl border shadow cursor-pointer">
                        <img src="${p.backPhoto}" onclick="zoomImage('${p.backPhoto}')" class="w-32 h-36 object-cover rounded-xl border shadow cursor-pointer">
                    </div>
                    <div>
                        <h4 class="font-bold text-gray-800 text-sm">${p.name} (<span class="text-red-600">ಸೈಜ್: ${p.size || 'M'}</span>)</h4>
                        <p class="text-[11px] text-gray-500">ಅಂಗಡಿ: ${p.vendorShop}</p>
                        <p class="text-[11px] text-indigo-600">ಬಣ್ಣ: ${p.colors} | ಸ್ಟಾಕ್: ${p.stock}</p>
                        <div class="flex items-center gap-2 mt-1">
                            <span class="text-red-500 line-through text-xs">₹${p.origPrice}</span>
                            <span class="text-green-600 font-bold text-sm">₹${p.discPrice}</span>
                        </div>
                    </div>
                    <button onclick="handleBuyClick(${p.id})" class="w-full bg-yellow-400 text-black py-2.5 rounded-xl font-bold text-xs shadow hover:bg-yellow-500">₹${p.discPrice} ಗೆ ಖರೀದಿಸಿ</button>
                </div>
            `).join('');
        }

        function searchProducts() {
            let query = document.getElementById('search-box').value.toLowerCase();
            let filtered = products.filter(p => p.name.toLowerCase().includes(query) || p.vendorShop.toLowerCase().includes(query));
            renderCustomerProducts(filtered);
        }

        function handleBuyClick(id) {
            // ಮೊದಲಿಗೆ ಗ್ರಾಹಕರ ಅಡ್ರೆಸ್ ಸೇವ್ ಆಗಿದೆಯಾ ಪರಿಶೀಲಿಸುವುದು. ಇಲ್ಲದಿದ್ದರೆ ಅಡ್ರೆಸ್/ಲಾಗಿನ್ ಪೇಜ್ ತೋರಿಸುವುದು.
            if (!currentCustomer) {
                pendingProductId = id;
                document.getElementById('dashboard-customer').classList.add('hidden');
                document.getElementById('auth-screen').classList.remove('hidden');
                return;
            }
            openBuyModal(id);
        }

        function openBuyModal(id) {
            let p = products.find(x => x.id === id);
            if (!p) return;

            let html = `
                <div class="text-left space-y-3 text-xs">
                    <div class="bg-gray-50 p-2 rounded border space-y-1">
                        <div class="flex justify-between items-center">
                            <p class="font-bold text-gray-800"><b>ವಿಳಾಸ:</b> ${currentCustomer.name}</p>
                            <button onclick="openAddressEdit()" class="text-blue-600 underline font-bold text-[11px]">ಅಡ್ರೆಸ್ ಬದಲಾಯಿಸಿ (Change)</button>
                        </div>
                        <p id="display-customer-address" class="text-gray-600">${currentCustomer.address}, ${currentCustomer.city}, ${currentCustomer.taluk} ತಾಲೂಕು, ${currentCustomer.district} ಜಿಲ್ಲೆ - ${currentCustomer.pincode}</p>
                        <p class="text-gray-600"><b>ಫೋನ್:</b> ${currentCustomer.phone}</p>
                    </div>

                    <!-- ಅಡ್ರೆಸ್ ಎಡಿಟ್ ಮಾಡುವ ಬಾಕ್ಸ್ (Default Hidden) -->
                    <div id="address-edit-box" class="hidden bg-indigo-50 p-2 rounded border space-y-2">
                        <p class="font-bold text-indigo-700">ವಿಳಾಸ ಬದಲಾಯಿಸಿ:</p>
                        <input type="text" id="edit-address" value="${currentCustomer.address}" class="w-full p-1.5 border rounded text-xs" placeholder="ವಿಳಾಸ">
                        <div class="grid grid-cols-2 gap-1">
                            <input type="text" id="edit-city" value="${currentCustomer.city}" class="p-1 border rounded text-xs" placeholder="ಊರು">
                            <input type="text" id="edit-pincode" value="${currentCustomer.pincode}" class="p-1 border rounded text-xs" placeholder="ಪಿನ್ ಕೋಡ್">
                        </div>
                        <button onclick="saveNewAddress()" class="bg-green-600 text-white px-3 py-1 rounded font-bold text-xs w-full">ಅಡ್ರೆಸ್ ಸೇವ್ ಮಾಡಿ</button>
                    </div>

                    <div class="flex gap-3 items-center border-b pb-2">
                        <img src="${p.frontPhoto}" class="w-16 h-16 object-cover rounded-lg border">
                        <div>
                            <p class="font-bold text-gray-800">${p.name} (<span class="text-red-600">ಸೈಜ್: ${p.size || 'M'}</span>)</p>
                            <p class="text-green-600 font-bold">₹${p.discPrice}</p>
                        </div>
                    </div>

                    <div>
                        <label class="font-semibold text-gray-700">ಎಷ್ಟು ಪೀಸ್ ಬೇಕು? (Quantity):</label>
                        <div class="flex items-center gap-3 mt-1">
                            <button onclick="changeQty(-1)" class="w-8 h-8 bg-gray-200 rounded font-bold text-sm">-</button>
                            <span id="order-qty" class="font-bold text-base">1</span>
                            <button onclick="changeQty(1)" class="w-8 h-8 bg-gray-200 rounded font-bold text-sm">+</button>
                        </div>
                    </div>

                    <div>
                        <label class="font-semibold text-gray-700">ಪಾವತಿ ವಿಧಾನ (Payment Mode):</label>
                        <select id="modal-payment-mode" class="w-full p-2 border rounded-lg text-xs mt-1">
                            <option value="UPI">UPI (Google Pay / PhonePe / Paytm)</option>
                            <option value="Credit Card">ಕ್ರೆಡಿಟ್ / ಡೆಬಿಟ್ ಕಾರ್ಡ್</option>
                            <option value="COD">ಕ್ಯಾಶ್ ಆನ್ ಡೆಲಿವರಿ (Cash on Delivery + ₹10)</option>
                        </select>
                    </div>

                    <button onclick="confirmOrderPopup(${p.id})" class="w-full bg-yellow-400 text-black py-2.5 rounded-xl font-bold text-xs shadow hover:bg-yellow-500">ಮುಂದುವರಿಸಿ (Continue)</button>
                </div>
            `;
            showModal("ಆರ್ಡರ್ ವಿವರಗಳು", html, "🛒", "");
        }

        function openAddressEdit() {
            let box = document.getElementById('address-edit-box');
            box.classList.toggle('hidden');
        }

        function saveNewAddress() {
            let newAddr = document.getElementById('edit-address').value;
            let newCity = document.getElementById('edit-city').value;
            let newPin = document.getElementById('edit-pincode').value;

            currentCustomer.address = newAddr;
            currentCustomer.city = newCity;
            currentCustomer.pincode = newPin;
            localStorage.setItem('currentCustomer', JSON.stringify(currentCustomer));

            document.getElementById('display-customer-address').innerText = `${newAddr}, ${newCity} ತಾಲೂಕು, ${currentCustomer.taluk} ಜಿಲ್ಲೆ - ${newPin}`;
            document.getElementById('address-edit-box').classList.add('hidden');
            alert('ವಿಳಾಸ ಯಶಸ್ವಿಯಾಗಿ ಬದಲಾಯಿಸಲಾಗಿದೆ!');
        }

        function changeQty(val) {
            let qtyEl = document.getElementById('order-qty');
            let q = Number(qtyEl.innerText) + val;
            if (q < 1) q = 1;
            qtyEl.innerText = q;
        }

        function confirmOrderPopup(id) {
            let p = products.find(x => x.id === id);
            let qty = Number(document.getElementById('order-qty').innerText);
            let paymentMode = document.getElementById('modal-payment-mode').value;
            let totalAmount = (p.discPrice * qty) + (paymentMode === 'COD' ? 10 : 0);

            document.getElementById('custom-modal').classList.add('hidden');

            let confirmHtml = `
                <div class="text-left space-y-3 text-xs">
                    <p class="font-bold text-gray-800 text-sm">ಆರ್ಡರ್ ದೃಢೀಕರಿಸಿ</p>
                    <p class="text-gray-600">ನೀವು ಆರ್ಡರ್ ಡೆಲಿವರಿ ಪಡೆಯುವಾಗ ನಗದು ಅಥವಾ UPI ಮೂಲಕ ಪಾವತಿಸಿ.</p>
                    <div class="bg-gray-50 p-2 rounded border space-y-1">
                        <p><b>ಒಟ್ಟು ಮೊತ್ತ:</b> ₹${totalAmount} (${paymentMode})</p>
                        <p><b>ವಸ್ತು:</b> ${p.name} (ಸೈಜ್: ${p.size || 'M'}) x${qty}</p>
                    </div>
                    <div class="flex gap-2 pt-2">
                        <button onclick="closeModal()" class="flex-1 bg-gray-200 text-gray-800 py-2.5 rounded-xl font-bold">ರದ್ದುಗೊಳಿಸಿ</button>
                        <button onclick="executeOrder(${p.id}, ${qty}, '${paymentMode}', ${totalAmount})" class="flex-1 bg-yellow-400 text-black py-2.5 rounded-xl font-bold shadow">ಆರ್ಡರ್ ದೃಢೀಕರಿಸಿ</button>
                    </div>
                </div>
            `;
            showModal("ಆರ್ಡರ್ ದೃಢೀಕರಣ", confirmHtml, "📦", "");
        }

        function executeOrder(id, qty, paymentMode, totalAmount) {
            let p = products.find(x => x.id === id);
            let savedOrders = JSON.parse(localStorage.getItem('market_orders')) || [];
            
            let newOrder = {
                id: Date.now(),
                customerName: currentCustomer.name,
                phone: currentCustomer.phone,
                district: currentCustomer.district,
                taluk: currentCustomer.taluk,
                city: currentCustomer.city,
                pincode: currentCustomer.pincode,
                address: `${currentCustomer.address}, ${currentCustomer.city}, ${currentCustomer.taluk} ತಾಲೂಕು, ${currentCustomer.district} ಜಿಲ್ಲೆ - ${currentCustomer.pincode}`,
                items: [{ ...p, quantity: qty, size: p.size || 'M' }],
                totalAmount: totalAmount,
                paymentMethod: paymentMode,
                status: 'ಆರ್ಡರ್ ಸ್ವೀಕರಿಸಲಾಗಿದೆ - ಪ್ಯಾಕಿಂಗ್ ನಡೆಯುತ್ತಿದೆ',
                acceptedByVendor: null,
                packingReady: false,
                delivered: false,
                isCancelled: false,
                cancelTime: '',
                isReturned: false,
                returnReason: '',
                timestamp: Date.now()
            };

            savedOrders.push(newOrder);
            localStorage.setItem('market_orders', JSON.stringify(savedOrders));

            // ಆರ್ಡರ್ ಯಶಸ್ವಿಯಾದ ನಂತರ ಮುಖಪುಟಕ್ಕೆ (ವಸ್ತುಗಳ ಪುಟಕ್ಕೆ) ಮರಳಿ ಕಳುಹಿಸುವುದು
            showModal("ಯಶಸ್ವಿ!", `
                <div class="text-center space-y-2">
                    <div class="text-green-600 text-5xl font-bold">✅</div>
                    <p class="font-bold text-sm text-gray-800">ಆರ್ಡರ್ ಯಶಸ್ವಿಯಾಗಿ ಸಲ್ಲಿಸಲಾಗಿದೆ!</p>
                    <p class="text-xs text-green-700 font-semibold">ನೀವು ಉಳಿಸಿದ ಮೊತ್ತ: ₹${(p.origPrice - p.discPrice) * qty}</p>
                    <p class="text-xs text-gray-600">ಒಟ್ಟು ಮೊತ್ತ: ₹${totalAmount} (${paymentMode})</p>
                    <button onclick="closeModal(); switchCustomerTab('orders');" class="w-full bg-indigo-600 text-white py-2.5 rounded-xl font-bold text-xs mt-2">ನನ್ನ ಆರ್ಡರ್‌ಗಳು ನೋಡಿ</button>
                </div>
            `, "", "");
        }

        function renderCustomerOrders() {
            let cOrdDiv = document.getElementById('customer-orders-list');
            let savedOrders = JSON.parse(localStorage.getItem('market_orders')) || [];
            let myOrders = savedOrders.filter(o => o.phone === currentCustomer.phone);

            myOrders.sort((a, b) => {
                if (a.isCancelled !== b.isCancelled) return a.isCancelled ? 1 : -1;
                if (a.delivered !== b.delivered) return a.delivered ? 1 : -1;
                return b.timestamp - a.timestamp;
            });

            if (myOrders.length === 0) {
                cOrdDiv.innerHTML = "ಯಾವುದೇ ಆರ್ಡರ್‌ಗಳಿಲ್ಲ.";
                return;
            }

            cOrdDiv.innerHTML = myOrders.map(o => `
                <div onclick="showOrderDetails(${o.id})" class="border p-3 rounded-xl ${o.isCancelled ? 'bg-red-50 opacity-75' : (o.delivered ? 'bg-gray-100' : 'bg-gray-50')} mb-3 space-y-2 cursor-pointer hover:bg-indigo-50 transition">
                    <div class="flex justify-between items-center border-b pb-1">
                        <span class="font-bold text-xs text-indigo-700">ಆರ್ಡರ್ ID: ${o.id}</span>
                        <span class="text-[10px] bg-green-100 text-green-800 px-2 py-0.5 rounded font-bold">${o.paymentMethod}</span>
                    </div>
                    ${o.items.map(i => `
                        <div class="flex gap-2 items-center">
                            <img src="${i.frontPhoto}" class="w-12 h-12 object-cover rounded border">
                            <div>
                                <p class="font-bold text-xs">${i.name} (<span class="text-red-600">ಸೈಜ್: ${i.size \vert{}\vert{} 'M'}</span>) x${i.quantity}</p>
                                <p class="text-[11px] text-green-600 font-bold">₹${i.discPrice * i.quantity}</p>
                            </div>
                        </div>
                    `).join('')}
                    <div class="pt-1 flex justify-between items-center">
                        <span class="text-[11px] font-semibold ${o.isCancelled ? 'text-red-600' : (o.delivered ? 'text-green-600' : 'text-indigo-600')}">
                            ${o.isCancelled ? '🔒 ಲಾಕ್ ಆಗಿದೆ: ಗ್ರಾಹಕರಿಂದ ಕ್ಯಾನ್ಸಲ್ ಮಾಡಲಾಗಿದೆ (' + o.cancelTime + ')' : 'ಸ್ಥಿತಿ: ' + o.status}
                        </span>
                        <span class="text-[10px] text-gray-400 underline">ವಿವರ ನೋಡಿ ▶</span>
                    </div>
                </div>
            `).join('');
        }

        function showOrderDetails(id) {
            let savedOrders = JSON.parse(localStorage.getItem('market_orders')) || [];
            let o = savedOrders.find(x => x.id === id);
            if (!o) return;

            let step1Active = !o.isCancelled;
            let step2Active = (!o.isCancelled && (o.packingReady || o.delivered));
            let step3Active = (!o.isCancelled && o.packingReady && !o.delivered);
            let step4Active = (!o.isCancelled && o.delivered);

            let dot1Class = "w-5 h-5 rounded-full flex items-center justify-center text-white text-[10px] font-bold " + (o.isCancelled ? "bg-red-500" : (step1Active ? "bg-green-600" : "bg-gray-300"));
            let dot2Class = "w-5 h-5 rounded-full flex items-center justify-center text-white text-[10px] font-bold " + (step2Active ? "bg-green-600" : "bg-gray-300");
            let dot3Class = "w-5 h-5 rounded-full flex items-center justify-center text-white text-[10px] font-bold " + (step3Active ? "bg-green-600" : "bg-gray-300");
            let dot4Class = "w-5 h-5 rounded-full flex items-center justify-center text-white text-[10px] font-bold " + (step4Active ? "bg-green-600" : "bg-gray-300");

            let statusMsg = "";
            if (o.isCancelled) {
                statusMsg = `🔒 ಈ ಆರ್ಡರ್ ಕ್ಯಾನ್ಸಲ್ ಮಾಡಲಾಗಿದೆ (${o.cancelTime}). ಲಾಕ್ ಮಾಡಲಾಗಿದೆ.`;
            } else if (o.delivered) {
                statusMsg = "✨ ಡೆಲಿವರಿ ಯಶಸ್ವಿಯಾಗಿದೆ (Success)!";
            } else if (o.packingReady) {
                statusMsg = "📦 ಪ್ಯಾಕಿಂಗ್ ಆಗಿ ಡೆಲಿವರಿಗೆ ಕಳುಹಿಸಲಾಗಿದೆ.";
            } else {
                statusMsg = "⏳ ಆರ್ಡರ್ ದೃಢೀಕರಿಸಲಾಗಿದೆ.";
            }

            let html = `
                <div class="text-left space-y-3 text-xs">
                    <div class="bg-indigo-50 p-2 rounded border space-y-1">
                        <p class="font-bold text-indigo-700">ಆರ್ಡರ್ ID: ${o.id}</p>
                        <p class="font-semibold text-gray-800 pt-1">${statusMsg}</p>
                    </div>

                    ${!o.isCancelled && !o.delivered && !o.packingReady ? `
                        <div class="bg-red-50 p-2 rounded border text-center space-y-2">
                            <p class="font-bold text-red-700">ಲೈವ್ ಆರ್ಡರ್ ಕ್ಯಾನ್ಸಲ್ ಮಾಡಲು ಬಟನ್:</p>
                            <button onclick="cancelCustomerOrder(${o.id})" class="bg-red-600 text-white px-4 py-2 rounded-xl font-bold shadow">❌ ಆರ್ಡರ್ ಕ್ಯಾನ್ಸಲ್ ಮಾಡಿ (Cancel Order)</button>
                        </div>
                    ` : ''}

                    <div class="p-3 bg-white rounded border space-y-2">
                        <p class="font-bold text-gray-700 mb-2">ಆರ್ಡರ್ ಸ್ಟೇಟಸ್ ಹಂತಗಳು:</p>
                        
                        <div class="flex items-center gap-3">
                            <div class="${dot1Class}">${o.isCancelled ? '✕' : '✓'}</div>
                            <div><p class="font-bold text-gray-800">1. ಆರ್ಡರ್ ದೃಢೀಕರಿಸಲಾಗಿದೆ</p></div>
                        </div>
                        <div class="ml-2.5 w-0.5 h-3 bg-gray-300"></div>

                        <div class="flex items-center gap-3">
                            <div class="${dot2Class}">${step2Active ? '✓' : '2'}</div>
                            <div><p class="font-bold text-gray-800">2. ಪ್ಯಾಕಿಂಗ್ ಆಗಿ ಡೆಲಿವರಿಗೆ ಕಳುಹಿಸಲಾಗಿದೆ</p></div>
                        </div>
                        <div class="ml-2.5 w-0.5 h-3 bg-gray-300"></div>

                        <div class="flex items-center gap-3">
                            <div class="${dot3Class}">${step3Active ? '✓' : '3'}</div>
                            <div><p class="font-bold text-gray-800">3. ಡೆಲಿವರಿ ಬಾಯ್ ಹೊರಟಿದ್ದಾರೆ</p></div>
                        </div>
                        <div class="ml-2.5 w-0.5 h-3 bg-gray-300"></div>

                        <div class="flex items-center gap-3">
                            <div class="${dot4Class}">${step4Active ? '✓' : '4'}</div>
                            <div><p class="font-bold text-gray-800">4. ಡೆಲಿವರಿ ಯಶಸ್ವಿ (Success)</p></div>
                        </div>
                    </div>

                    <div class="border-t pt-2">
                        <p class="font-bold text-gray-700 mb-1">ವಸ್ತುವಿನ ವಿವರ:</p>
                        ${o.items.map(i => `
                            <div class="flex gap-2 items-center border-b pb-1">
                                <img src="${i.frontPhoto}" class="w-12 h-12 object-cover rounded border">
                                <div class="flex-1">
                                    <p class="font-bold">${i.name} (<span class="text-red-600">ಸೈಜ್: ${i.size \vert{}\vert{} 'M'}</span>) x${i.quantity}</p>
                                    <p class="text-green-600 font-bold">₹${i.discPrice * i.quantity}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="border-t pt-2 text-[11px] text-gray-600 space-y-1">
                        <p><b>ಗ್ರಾಹಕರ ಹೆಸರು:</b> ${o.customerName} (📞 ${o.phone})</p>
                        <p><b>ಪೂರ್ಣ ವಿಳಾಸ:</b> ${o.address}</p>
                    </div>
                </div>
            `;
            
            let buttonsHtml = `
                <button onclick="document.getElementById('custom-modal').classList.add('hidden')" class="w-full bg-indigo-600 text-white py-2 rounded-xl font-bold text-xs">ಸರಿ (OK)</button>
            `;
            showModal("ಆರ್ಡರ್ ಟ್ರ್ಯಾಕಿಂಗ್ ವಿವರ", html, "📦", buttonsHtml);
        }

        function cancelCustomerOrder(id) {
            let savedOrders = JSON.parse(localStorage.getItem('market_orders')) || [];
            let o = savedOrders.find(x => x.id === id);
            if (o) {
                let timeStr = new Date().toLocaleTimeString();
                o.isCancelled = true;
                o.cancelTime = timeStr;
                o.status = `ಕ್ಯಾನ್ಸಲ್ ಮಾಡಲಾಗಿದೆ (${timeStr}) - ಅಂಗಡಿ ಮತ್ತು ಡೆಲಿವರಿ ಬಾಯ್‌ಗೆ ತಿಳಿಸಲಾಗಿದೆ`;
                localStorage.setItem('market_orders', JSON.stringify(savedOrders));
                document.getElementById('custom-modal').classList.add('hidden');
                showModal("ಯಶಸ್ವಿ!", "ನಿಮ್ಮ ಆರ್ಡರ್ ಕ್ಯಾನ್ಸಲ್ ಮಾಡಲಾಗಿದೆ! ಅಂಗಡಿ ಮಾಲೀಕರಿಗೆ ಮತ್ತು ಡೆಲಿವರಿ ಬಾಯ್‌ಗೆ ಸಂದೇಶ ಕಳುಹಿಸಲಾಗಿದೆ.", "❌");
                renderCustomerOrders();
            }
        }

        // ಮೊಬೈಲ್ ಬ್ಯಾಕ್ ಬಟನ್ ಒತ್ತಿದಾಗ ಪೇಜ್ ಸಂಪೂರ್ಣವಾಗಿ ಮಾಯವಾಗದೆ, ಹಿಂದಿನ ಸೆಕ್ಷನ್‌ಗೆ ಅಥವಾ ಮುಖಪುಟಕ್ಕೆ ಮರಳುವಂತೆ ನಿರ್ವಹಿಸುವುದು
        window.addEventListener('popstate', function(event) {
            let authScreen = document.getElementById('auth-screen');
            let modal = document.getElementById('custom-modal');
            
            if (!modal.classList.contains('hidden')) {
                modal.classList.add('hidden');
            } else if (!authScreen.classList.contains('hidden')) {
                goBackToBrowse();
            }
        });

        initApp();
    </script>
</body>
</html>
