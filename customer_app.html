<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ಲೋಕಲ್ ಶಾಪಿಂಗ್ - Customer App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .map-route {
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 16px 16px;
        }
    </style>
</head>
<body class="bg-slate-100 font-sans min-h-screen pb-20">

    <!-- Header Navigation -->
    <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-40">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-lg font-black tracking-wide">🛍️ ಲೋಕಲ್ ಮಾರ್ಕೆಟ್ ಶಾಪಿಂಗ್</h1>
                <p class="text-[11px] text-indigo-200">ನಿಮ್ಮ ಹತ್ತಿರದ ಅಂಗಡಿಗಳಿಂದ 30 ನಿಮಿಷದಲ್ಲಿ ಡೆಲಿವರಿ</p>
            </div>
            
            <!-- Cart Button -->
            <button onclick="openCartModal()" class="relative bg-indigo-700 hover:bg-indigo-800 p-2.5 rounded-2xl shadow">
                🛒 <span id="cartBadge" class="absolute -top-1 -right-1 bg-amber-400 text-indigo-950 text-[10px] font-black px-1.5 py-0.5 rounded-full">0</span>
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- Banner -->
        <div class="bg-gradient-to-r from-indigo-500 to-purple-600 rounded-3xl p-4 text-white shadow-md">
            <span class="text-[10px] bg-white/20 px-2 py-0.5 rounded-full font-bold">⚡ ಫ್ಲ್ಯಾಶ್ ಡೆಲಿವರಿ</span>
            <h2 class="text-base font-bold mt-1">ಸ್ಥಳೀಯ ಅಂಗಡಿಗಳಿಂದ ನೇರ ಖರೀದಿ!</h2>
            <p class="text-xs text-indigo-100 mt-0.5">ಅಂಗಡಿಯವರು ಹಾಕಿದ ಇತ್ತೀಚಿನ ಆಫರ್ ಫೋಟೋಗಳು ಇಲ್ಲಿವೆ.</p>
        </div>

        <!-- Search Bar -->
        <div class="relative">
            <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="🔍 ಬಟ್ಟೆ, ಚಪ್ಪಲಿ, ದಿನಸಿ ಹುಡುಕಿ..." class="w-full p-3 pl-4 rounded-2xl border bg-white text-xs outline-none shadow-sm focus:ring-2 focus:ring-indigo-500">
        </div>

        <!-- Dynamic Product Grid (Flipkart Style Cards) -->
        <div>
            <h3 class="text-xs font-bold text-slate-700 mb-2 flex justify-between items-center">
                <span>🔥 ಲೈವ್ ಲಭ್ಯವಿರುವ ಸಾಮಗ್ರಿಗಳು</span>
                <span id="liveItemsCount" class="text-[10px] bg-slate-200 px-2 py-0.5 rounded-full">0 Item</span>
            </h3>

            <div id="customerProductGrid" class="grid grid-cols-2 gap-3">
                <!-- Syncs with Shop Owner uploaded products -->
            </div>
        </div>

    </main>

    <!-- ========================================== -->
    <!-- MODAL 1: CART & CHECKOUT                   -->
    <!-- ========================================== -->
    <div id="cartModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl shadow-2xl p-5 max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center border-b pb-3">
                <h2 class="font-bold text-sm text-slate-800">🛒 ನಿಮ್ಮ ಕಾರ್ಟ್ (Your Cart)</h2>
                <button onclick="closeCartModal()" class="text-slate-400 font-bold">✕</button>
            </div>

            <div id="cartItemsList" class="my-3 overflow-y-auto flex-1 space-y-2">
                <!-- Cart Items -->
            </div>

            <div class="border-t pt-3 space-y-3">
                <div class="flex justify-between text-xs font-bold">
                    <span>ಒಟ್ಟು ಮೊತ್ತ (Total Amount):</span>
                    <span id="cartTotal" class="text-indigo-600 text-sm">₹0</span>
                </div>

                <form onsubmit="placeOrder(event)" class="space-y-2">
                    <input type="text" id="custName" required placeholder="ನಿಮ್ಮ ಹೆಸರು" class="w-full p-2 border rounded-xl
